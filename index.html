    <!-- Resolve theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('yp-theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
