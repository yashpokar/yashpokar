# Keeps the "Latest writing" section of the profile README in sync
# with the site's RSS feed and Medium. Runs daily and on demand.
name: Update latest posts

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://yashpokar.com/rss.xml,https://medium.com/feed/@yashpokar'
          max_post_count: 6
          template: '- [$title]($url) <sub>· $date</sub>$newline'
          date_format: 'mmm d, yyyy'
          commit_message: 'docs: refresh latest posts'
